<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medical Records – Aegis AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(90deg, #0d9488, #134e4a);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .topbar h2 {
      font-size: 20px;
      color: #fff;
      font-weight: 700;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 28px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 32px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .card h2 {
      font-size: 16px;
      color: #5eead4;
      font-weight: 600;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: #0f172a;
    }

    td {
      padding: 14px 16px;
      font-size: 14px;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    tbody tr:hover {
      background: rgba(20, 184, 166, 0.05);
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 24px;
      color: #5eead4;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    .empty {
      color: #64748b;
      font-size: 15px;
      padding: 20px 0;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h2>Aegis AI – Medical Records</h2>
    <button class="logout-btn" onclick="window.location.href='/logout'">Logout</button>
  </div>
  <div class="container">
    <a href="/dashboard" class="back-btn">← Back to Dashboard</a>
    <div class="card">
      <h2>Patient ID: {{ patient_id }}</h2>
      {% if records %}
      <table>
        <thead>
          <tr>
            <th>Hospital</th>
            <th>Doctor</th>
            <th>Timing</th>
            <th>Issue</th>
          </tr>
        </thead>
        <tbody>
          {% for record in records %}
          <tr>
            <td>{{ record[0] }}</td>
            <td>{{ record[1] }}</td>
            <td>{{ record[2] }}</td>
            <td>{{ record[3] }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="empty">No records found for this patient.</p>
      {% endif %}
    </div>
  </div>
</body>

</html>
